<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Patitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav>
            <a href="index.html" class="nav-btn">Volver al Inicio</a>
        </nav>
    </header>

    <div class="container">
        <div class="auth-box">
            <h2>Registro de Adoptante</h2>
            <form onsubmit="registrarUsuario(event)">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombreReg" placeholder="Ej. Juan" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="emailReg" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="passReg" placeholder="********" required>
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <div class="switch-link">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <script>
        function registrarUsuario(event) {
            event.preventDefault();
            const nombre = document.getElementById('nombreReg').value;
            const email = document.getElementById('emailReg').value;
            const password = document.getElementById('passReg').value;

            let usuarios = JSON.parse(localStorage.getItem('patitas_usuarios')) || [];
            
            if(usuarios.some(u => u.email === email)) {
                alert("Este correo ya está registrado.");
                return;
            }

            // Tipo predeterminado como Adoptante
            const nuevoUsuario = { nombre, email, password, tipo: "Adoptante" };
            usuarios.push(nuevoUsuario);
            localStorage.setItem('patitas_usuarios', JSON.stringify(usuarios));

            alert("Registro enviado al administrador para su evaluación.");
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
