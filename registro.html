<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Patitas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilo específico para centrar el título de la tarjeta */
        .auth-box h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav>
            <a href="index.html" class="nav-btn">Volver al Inicio</a>
        </nav>
    </header>

    <div class="container">
        <div class="auth-box">
            <h2>Registro</h2>
            <form onsubmit="registrarUsuario(event)">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" id="nombreReg" placeholder="Ej. Juan" required>
                </div>
                <div class="form-group">
                    <label>Apellido Paterno:</label>
                    <input type="text" id="appPaternoReg" placeholder="Ej. Pérez" required>
                </div>
                <div class="form-group">
                    <label>Apellido Materno:</label>
                    <input type="text" id="appMaternoReg" placeholder="Ej. Gómez" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="emailReg" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="passReg" placeholder="********" required>
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <div class="switch-link">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Modal personalizado para mensajes limpios -->
    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, callback = null) {
            document.getElementById('modalMessage').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function registrarUsuario(event) {
            event.preventDefault();
            const nombre = document.getElementById('nombreReg').value;
            const appPaterno = document.getElementById('appPaternoReg').value;
            const appMaterno = document.getElementById('appMaternoReg').value;
            const email = document.getElementById('emailReg').value;
            const password = document.getElementById('passReg').value;

            let usuarios = JSON.parse(localStorage.getItem('patitas_usuarios')) || [];
            
            if(usuarios.some(u => u.email === email)) {
                mostrarMensaje("Este correo ya está registrado.");
                return;
            }

            const nuevoUsuario = { nombre, appPaterno, appMaterno, email, password, tipo: "Adoptante" };
            usuarios.push(nuevoUsuario);
            localStorage.setItem('patitas_usuarios', JSON.stringify(usuarios));

            // Al hacer clic en aceptar, redirige a login
            mostrarMensaje("Registro enviado al administrador para su evaluación.", () => {
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
