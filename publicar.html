<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Mascota - Patitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav>
            <a href="index.html" class="nav-btn">Inicio / Galería</a>
        </nav>
    </header>

    <div class="container">
        <h2>Publicar una nueva mascota</h2>
        <form id="formPublicar" onsubmit="guardarMascota(event)">
            <div class="form-group">
                <label>Nombre de la mascota:</label>
                <input type="text" id="nombre" placeholder="Ej. Rocky" required>
            </div>
            <div class="form-group">
                <label>Especie:</label>
                <select id="especie" required>
                    <option value="">Selecciona una especie</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                </select>
            </div>
            <div class="form-group">
                <label>Edad:</label>
                <input type="text" id="edad" placeholder="Ej. 8 meses o 2 años" required>
            </div>
            <div class="form-group">
                <label>Carácter / Personalidad:</label>
                <textarea id="caracter" rows="3" placeholder="Ej. Muy activo, le gusta jugar" required></textarea>
            </div>
            <div class="form-group">
                <label>Foto de la mascota (PNG o JPG):</label>
                <input type="file" id="fotoArchivo" accept="image/png, image/jpeg" required>
            </div>
            <button type="submit">Enviar a Evaluación</button>
        </form>
    </div>

    <!-- Modal personalizado -->
    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, callback = null) {
            document.getElementById('modalMessage').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        const usuarioActivo = JSON.parse(localStorage.getItem('patitas_usuario_activo'));
        if (!usuarioActivo || (usuarioActivo.tipo !== 'Refugio' && usuarioActivo.tipo !== 'Admin')) {
            mostrarMensaje("Acceso denegado.", () => {
                window.location.href = 'index.html';
            });
        }

        function guardarMascota(event) {
            event.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const especie = document.getElementById('especie').value;
            const edad = document.getElementById('edad').value;
            const caracter = document.getElementById('caracter').value;
            const archivoInput = document.getElementById('fotoArchivo');

            const archivo = archivoInput.files[0];
            if (archivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const nuevaMascota = {
                        nombre,
                        especie,
                        edad,
                        caracter,
                        foto: e.target.result,
                        estado: "Pendiente" // Se guarda en evaluación, no va directo a la galería principal
                    };

                    let pendientes = JSON.parse(localStorage.getItem('patitas_mascotas_pendientes')) || [];
                    pendientes.push(nuevaMascota);
                    localStorage.setItem('patitas_mascotas_pendientes', JSON.stringify(pendientes));

                    mostrarMensaje("La mascota ha sido enviada al administrador para su evaluación antes de publicarse.", () => {
                        window.location.href = 'index.html';
                    });
                };
                reader.readAsDataURL(archivo);
            }
        }
    </script>
</body>
</html>
