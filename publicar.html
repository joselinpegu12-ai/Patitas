<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Publicar Mascota - Patitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav>
            <a href="index.html" class="nav-btn">Volver al Inicio</a>
        </nav>
    </header>

    <div class="container">
        <form onsubmit="registrarMascota(event)">
            <h2>Publicar una nueva mascota</h2>
            
            <div class="form-group">
                <label>Nombre de la mascota:</label>
                <input type="text" id="nombreMascota" placeholder="Ej. Rocky" required>
            </div>

            <div class="form-group">
                <label>Especie:</label>
                <select id="especieMascota" required>
                    <option value="">Selecciona...</option>
                    <option value="Perro">Perro</option>
                    <option value="Gato">Gato</option>
                </select>
            </div>

            <div class="form-group">
                <label>Edad:</label>
                <input type="text" id="edadMascota" placeholder="Ej. 1 año" required>
            </div>

            <div class="form-group">
                <label>Carácter / Personalidad:</label>
                <textarea id="caracterMascota" rows="3" placeholder="Ej. Juguetón, amigable..." required></textarea>
            </div>

            <div class="form-group">
                <label>Foto de la mascota (PNG o JPG):</label>
                <input type="file" id="fotoMascota" accept="image/*" required>
            </div>

            <button type="submit">Publicar Mascota</button>
        </form>
    </div>

    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, callback = null) {
            document.getElementById('modalMessage').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }
        function cerrarModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) { window.modalCallback(); window.modalCallback = null; }
        }

        const usuarioActivo = JSON.parse(localStorage.getItem('patitas_usuario_activo'));
        if (!usuarioActivo) {
            mostrarMensaje("Debes iniciar sesión para publicar.", () => {
                window.location.href = 'login.html';
            });
        }

        function registrarMascota(event) {
            event.preventDefault();
            
            const nombre = document.getElementById('nombreMascota').value.trim();
            const especie = document.getElementById('especieMascota').value;
            const edad = document.getElementById('edadMascota').value.trim();
            const caracter = document.getElementById('caracterMascota').value.trim();
            const inputFoto = document.getElementById('fotoMascota');

            const archivo = inputFoto.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(e) {
                    const base64Image = e.target.result;

                    let mascotas = JSON.parse(localStorage.getItem('patitas_mascotas')) || [];
                    mascotas.push({
                        nombre,
                        especie,
                        edad,
                        caracter,
                        foto: base64Image
                    });
                    localStorage.setItem('patitas_mascotas', JSON.stringify(mascotas));

                    mostrarMensaje("Mascota publicada con éxito.", () => {
                        window.location.href = 'index.html';
                    });
                };
                lector.readAsDataURL(archivo);
            }
        }
    </script>
</body>
</html>
