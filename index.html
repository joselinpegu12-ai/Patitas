<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Patitas - Adopción de Mascotas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <p>Plataforma de Adopción de Mascotas</p>
        <nav>
            <a href="index.html">Inicio / Galería</a>
            <a href="publicar.html">Publicar Mascota (Refugios)</a>
        </nav>
    </header>
    <div class="container">
        <h2>Mascotas buscando un hogar</h2>
        <div class="grid-mascotas">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400" alt="Max">
                <div class="card-content">
                    <h3>Max</h3>
                    <p><strong>Edad:</strong> 2 años</p>
                    <p><strong>Carácter:</strong> Juguetón y amigable</p>
                    <button>Solicitar Adopción</button>
                </div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400" alt="Luna">
                <div class="card-content">
                    <h3>Luna</h3>
                    <p><strong>Edad:</strong> 1 año</p>
                    <p><strong>Carácter:</strong> Tranquila y cariñosa</p>
                    <button>Solicitar Adopción</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
