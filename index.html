<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Patitas - Plataforma de Adopción</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav id="navBar">
            <a href="index.html" class="nav-btn">Inicio</a>
            <a href="publicar.html" id="linkPublicar" class="nav-btn" style="display:none;">Publicar Mascota</a>
            <span id="userSpan" style="font-weight: bold; margin-left: 10px;"></span>
            <a href="login.html" id="linkLogin" class="nav-btn">Iniciar Sesión</a>
            <a href="#" id="linkLogout" class="nav-btn nav-logout" onclick="cerrarSesion()" style="display:none;">Cerrar Sesión</a>
        </nav>
    </header>

    <div class="container">
        <h2>Mascotas buscando un hogar</h2>
        
        <div class="filtros-box">
            <label for="filtroEspecie"><strong>Filtrar por especie:</strong></label>
            <select id="filtroEspecie" onchange="filtrarMascotas()">
                <option value="todos">Todos</option>
                <option value="Perro">Perros</option>
                <option value="Gato">Gatos</option>
            </select>
        </div>

        <div class="grid-mascotas" id="gridMascotas"></div>
    </div>

    <!-- Modal para mensajes limpios sin dominios -->
    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, callback = null) {
            document.getElementById('modalMessage').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        // Mascotas por defecto con iconos limpios en formato SVG / DataURI para no usar enlaces externos rotos
        const mascotasDefault = [
            {
                nombre: "Max",
                especie: "Perro",
                edad: "2 años",
                caracter: "Juguetón y muy amigable con niños.",
                foto: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='100%' height='100%' fill='%23e2e8f0'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='24' fill='%2364748b'>🐶 Max (Perro)</text></svg>"
            },
            {
                nombre: "Luna",
                especie: "Gato",
                edad: "1 año",
                caracter: "Tranquila, independiente y cariñosa.",
                foto: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='100%' height='100%' fill='%23e2e8f0'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='24' fill='%2364748b'>🐱 Luna (Gato)</text></svg>"
            }
        ];

        function obtenerMascotas() {
            let guardadas = JSON.parse(localStorage.getItem('patitas_mascotas'));
            if (!guardadas || guardadas.length === 0) {
                localStorage.setItem('patitas_mascotas', JSON.stringify(mascotasDefault));
                return mascotasDefault;
            }
            return guardadas;
        }

        function verificarSesion() {
            const usuarioActivo = JSON.parse(localStorage.getItem('patitas_usuario_activo'));
            const linkLogin = document.getElementById('linkLogin');
            const linkLogout = document.getElementById('linkLogout');
            const linkPublicar = document.getElementById('linkPublicar');
            const userSpan = document.getElementById('userSpan');

            if (usuarioActivo) {
                linkLogin.style.display = 'none';
                linkLogout.style.display = 'inline-block';
                const primerNombre = usuarioActivo.nombre.trim().split(' ')[0];
                userSpan.textContent = primerNombre;
                
                // SOLO aparece si es Refugio o Administrador
                if (usuarioActivo.tipo === 'Refugio' || usuarioActivo.tipo === 'Admin' || usuarioActivo.email === 'admin@patitas.com') {
                    linkPublicar.style.display = 'inline-block';
                } else {
                    linkPublicar.style.display = 'none';
                }
            } else {
                linkLogin.style.display = 'inline-block';
                linkLogout.style.display = 'none';
                userSpan.textContent = '';
                linkPublicar.style.display = 'none';
            }
        }

        function mostrarMascotas(lista) {
            const grid = document.getElementById('gridMascotas');
            grid.innerHTML = "";
            
            if (lista.length === 0) {
                grid.innerHTML = "<p>No hay mascotas registradas con ese filtro.</p>";
                return;
            }

            lista.forEach((m) => {
                const botonesHTML = `<button class="btn-adoptar" onclick="solicitarAdopcion('${m.nombre}')">Solicitar Adopción</button>`;

                grid.innerHTML += `
                    <div class="card">
                        <img src="${m.foto}" alt="${m.nombre}">
                        <div class="card-content">
                            <div>
                                <h3>${m.nombre}</h3>
                                <p><strong>Especie:</strong> ${m.especie}</p>
                                <p><strong>Edad:</strong> ${m.edad}</p>
                                <p><strong>Carácter:</strong> ${m.caracter}</p>
                            </div>
                            <div>${botonesHTML}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarMascotas() {
            const especieSeleccionada = document.getElementById('filtroEspecie').value;
            const mascotas = obtenerMascotas();
            
            if (especieSeleccionada === 'todos') {
                mostrarMascotas(mascotas);
            } else {
                const filtradas = mascotas.filter(m => m.especie === especieSeleccionada);
                mostrarMascotas(filtradas);
            }
        }

        function solicitarAdopcion(nombreMascota) {
            const usuarioActivo = JSON.parse(localStorage.getItem('patitas_usuario_activo'));
            if (!usuarioActivo) {
                mostrarMensaje("Debes iniciar sesión para poder solicitar una adopción.", () => {
                    window.location.href = 'login.html';
                });
                return;
            }

            let solicitudes = JSON.parse(localStorage.getItem('patitas_solicitudes')) || [];
            solicitudes.push({
                mascota: nombreMascota,
                usuario: `${usuarioActivo.nombre} ${usuarioActivo.appPaterno || ''}`,
                email: usuarioActivo.email,
                fecha: new Date().toLocaleDateString()
            });
            localStorage.setItem('patitas_solicitudes', JSON.stringify(solicitudes));

            mostrarMensaje("Solicitud enviada. El administrador evaluará tu perfil para la adopción.");
        }

        function cerrarSesion() {
            localStorage.removeItem('patitas_usuario_activo');
            mostrarMensaje("Has cerrado sesión correctamente.", () => {
                window.location.href = 'index.html';
            });
        }

        window.onload = () => {
            verificarSesion();
            mostrarMascotas(obtenerMascotas());
        };
    </script>
</body>
</html>
