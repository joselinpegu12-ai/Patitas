<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Patitas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav>
            <a href="index.html" class="nav-btn">Volver al Inicio</a>
        </nav>
    </header>

    <div class="container">
        <div class="auth-box">
            <h2>Iniciar Sesión</h2>
            <form onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="emailLogin" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="passLogin" placeholder="********" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <div class="switch-link">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Modal personalizado -->
    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, callback = null) {
            document.getElementById('modalMessage').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function iniciarSesion(event) {
            event.preventDefault();
            const email = document.getElementById('emailLogin').value;
            const password = document.getElementById('passLogin').value;

            let usuarios = JSON.parse(localStorage.getItem('patitas_usuarios')) || [];
            
            if(email === "admin@patitas.com" && password === "123456") {
                const adminUser = { nombre: "Administrador", email: email, tipo: "Admin" };
                localStorage.setItem('patitas_usuario_activo', JSON.stringify(adminUser));
                window.location.href = 'index.html';
                return;
            }

            const encontrado = usuarios.find(u => u.email === email && u.password === password);
            if (encontrado) {
                localStorage.setItem('patitas_usuario_activo', JSON.stringify(encontrado));
                window.location.href = 'index.html';
            } else {
                mostrarMensaje("Correo o contraseña incorrectos.");
            }
        }
    </script>
</body>
</html>
