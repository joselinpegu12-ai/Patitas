<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Patitas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-box h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Patitas</h1>
        <nav>
            <a href="index.html" class="nav-btn">Volver al Inicio</a>
        </nav>
    </header>

    <div class="container">
        <div class="auth-box">
            <h2>Iniciar Sesión</h2>
            <form onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="emailLogin" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="passLogin" placeholder="********" required>
                </div>
                <button type="submit">Ingresar</button>
            </form>
            <div class="switch-link" style="margin-top: 15px; text-align: center;">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Modal personalizado para alertas limpias -->
    <div id="customModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="cerrarModal()">Aceptar</button>
        </div>
    </div>

    <script>
        function mostrarMensaje(texto, callback = null) {
            document.getElementById('modalMessage').textContent = texto;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }

        function cerrarModal() {
            document.getElementById('customModal').style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function iniciarSesion(event) {
            event.preventDefault();
            const email = document.getElementById('emailLogin').value.trim();
            const password = document.getElementById('passLogin').value.trim();

            // Cuenta Administrador Principal predeterminada con tus datos
            if (email === "joselinpegu12@gmail.com" && password === "1234") {
                const adminUser = {
                    nombre: "Joselin",
                    appPaterno: "Admin",
                    email: "joselinpegu12@gmail.com",
                    tipo: "Admin"
                };
                localStorage.setItem('patitas_usuario_activo', JSON.stringify(adminUser));
                
                // Asegurar que exista en la lista de usuarios
                let usuarios = JSON.parse(localStorage.getItem('patitas_usuarios')) || [];
                if (!usuarios.some(u => u.email === email)) {
                    usuarios.push(adminUser);
                    localStorage.setItem('patitas_usuarios', JSON.stringify(usuarios));
                }

                mostrarMensaje("¡Bienvenida de vuelta, Joselin!", () => {
                    window.location.href = 'index.html';
                });
                return;
            }

            // Buscar en los usuarios registrados normalmente
            let usuarios = JSON.parse(localStorage.getItem('patitas_usuarios')) || [];
            const usuarioEncontrado = usuarios.find(u => u.email === email && u.password === password);

            if (usuarioEncontrado) {
                localStorage.setItem('patitas_usuario_activo', JSON.stringify(usuarioEncontrado));
                mostrarMensaje(`¡Bienvenido/a, ${usuarioEncontrado.nombre}!`, () => {
                    window.location.href = 'index.html';
                });
            } else {
                mostrarMensaje("Correo o contraseña incorrectos.");
            }
        }
    </script>
</body>
</html>
